# قاعدة بيانات للتطوير على جهازك: PostgreSQL 16 + PostGIS
# التشغيل:  docker compose up -d
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: resell
      POSTGRES_PASSWORD: resell
      POSTGRES_DB: resell
    ports:
      - "5432:5432"
    volumes:
      - resell-db:/var/lib/postgresql/data

volumes:
  resell-db:
